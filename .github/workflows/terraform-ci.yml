name: Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    paths:
      - "bootstrap/**"
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        directory:
          - bootstrap
          - terraform

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  required:
    name: Format and validate Terraform
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm every Terraform validation passed
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = "success"
