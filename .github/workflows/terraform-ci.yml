name: Infrastructure CI

on:
  push:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    paths:
      - "bootstrap/**"
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        directory:
          - bootstrap
          - terraform

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  required:
    name: Format and validate Terraform
    needs:
      - validate
      - validate_ansible
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm every infrastructure validation passed
        env:
          TERRAFORM_RESULT: ${{ needs.validate.result }}
          ANSIBLE_RESULT: ${{ needs.validate_ansible.result }}
        run: |
          test "$TERRAFORM_RESULT" = "success"
          test "$ANSIBLE_RESULT" = "success"

  validate_ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ansible Core
        run: pip install ansible-core==2.21.3

      - name: Check playbook syntax
        run: >-
          ansible-playbook
          --inventory inventory/hosts.ini.example
          --syntax-check
          site.yml
