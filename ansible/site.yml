---
- name: Configure the Book Notes application host
  hosts: app
  become: true
  gather_facts: true

  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    - name: Confirm the host runs a supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_release"] == "noble"
          - ansible_facts["architecture"] == "x86_64"
        fail_msg: This playbook expects Ubuntu 24.04 on x86_64.

    - name: Install packages required by the Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add the official Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - https://download.docker.com/linux/ubuntu
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        architectures:
          - amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present
      register: docker_repository

    - name: Refresh APT after adding the Docker repository
      ansible.builtin.apt:
        update_cache: true
      when: docker_repository.changed

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Allow the SSH administrator to use Docker without sudo
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Reconnect to activate the new group membership
      ansible.builtin.meta: reset_connection

    - name: Verify access to the Docker daemon
      ansible.builtin.command: docker info
      become: false
      changed_when: false

    - name: Verify the Docker Compose plugin
      ansible.builtin.command: docker compose version
      become: false
      changed_when: false
